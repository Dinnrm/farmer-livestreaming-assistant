*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--page); color: var(--ink); font: 1rem/1.55 var(--font); }
button, input, textarea { font: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .55; }
a { color: var(--green); }
:focus-visible { outline: 2px solid #3c7351; outline-offset: 3px; }
i[data-icon] { display: inline-flex; flex: none; line-height: 1; font-size: 1.12em; }
i[data-icon] svg { width: 1em; height: 1em; }
.frame { width: min(100% - 72px, 1240px); margin-inline: auto; }
.skip-link { position: fixed; z-index: 5; top: 10px; left: 12px; padding: 10px 14px; background: var(--paper); border-radius: 8px; transform: translateY(-150%); }

.header-inner { min-height: 69px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
.brand { display: inline-flex; align-items: center; gap: 10px; justify-self: start; color: var(--ink); text-decoration: none; }
.brand img { display: block; }
.brand strong, .brand small { display: block; }
.brand strong { font-size: 1.125rem; letter-spacing: .04em; line-height: 1.3; }
.brand small { font-size: .75rem; color: var(--muted); margin-top: 2px; }
.nav { display: flex; align-items: center; gap: 5px; }
.nav-link, .button {
  display: inline-flex; justify-content: center; align-items: center; gap: 7px; min-height: 43px; padding: 8px 13px;
  border: 1px solid transparent; border-radius: 10px; background: transparent; color: var(--green);
  font-size: .875rem; font-weight: 700; white-space: nowrap; text-decoration: none;
}
.nav-link { color: var(--muted); min-height: 41px; }
.nav-link:hover, .nav-link.active, .quiet:hover { background: var(--leaf); color: var(--green); }
.primary { background: var(--green); color: #fff; border-color: var(--green); box-shadow: 0 2px 3px #152d251e; }
.primary:hover { background: var(--green-hover); border-color: var(--green-hover); }
.secondary { background: var(--paper); border-color: var(--line); }
.secondary:hover { background: var(--leaf); border-color: var(--leaf-line); }
.quiet { color: var(--muted); }
.header-help { justify-self: end; }
.intro { display: grid; grid-template-columns: minmax(0, 1fr) minmax(290px, 340px); align-items: center; gap: 28px; margin: 8px 0 25px; }
.intro h1 { font: 800 clamp(2.1rem, 3.25vw, 3.15rem)/1.18 var(--serif); letter-spacing: .01em; margin: 0; }
.intro p { color: var(--muted); margin: 9px 0 14px; }
.intro-actions { display: flex; flex-wrap: wrap; gap: 6px; }
.product-card { min-height: 133px; position: relative; isolation: isolate; display: flex; justify-content: space-between; align-items: end; gap: 10px; overflow: hidden; padding: 16px; background: #263e2d; color: #fff; border-radius: 16px; }
.product-photo { position: absolute; inset: 0; z-index: -1; background: radial-gradient(ellipse at bottom right, #4c7150, transparent 70%), #263e2d; }
.product-card.sample .product-photo { background: linear-gradient(90deg, #1f3a2b 32%, #273c2cb0 65%, #28281b40), var(--fruit) 100% 52% / 78% auto no-repeat, #273e2d; }
.product-content { min-width: 0; }
.product-content strong, .product-content small, .product-label { display: block; overflow-wrap: anywhere; }
.product-label { display: flex; align-items: center; gap: 4px; color: #d7e8d6; font-size: .75rem; }
.product-content strong { font-size: 1.14rem; margin-top: 5px; }
.product-content small { color: #e4eee0; font-size: .8125rem; margin-top: 1px; }
.product-change { min-height: 39px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid #e6f3de66; border-radius: 8px; padding: 6px 9px; background: #18291cbb; color: #fff; font-size: .8125rem; white-space: nowrap; }
.product-change:hover { background: #183626; }
.product-change:focus-visible { outline-color: #fff; }
.workspace { scroll-margin-top: 14px; background: var(--shell); border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow); }
.workspace-bar { min-height: 61px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 17px; border-bottom: 1px solid var(--line); }
.modes { display: flex; align-items: center; gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 11px; background: var(--soft); }
.mode { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 4px 12px; border: 1px solid transparent; border-radius: 8px; background: transparent; color: var(--muted); font-size: .875rem; font-weight: 700; white-space: nowrap; }
.mode[aria-pressed="true"] { border-color: var(--leaf-line); color: var(--green); background: var(--paper); box-shadow: 0 1px 2px #28443110; }
.mode:hover { color: var(--green); }
.work-actions { display: flex; gap: 10px; align-items: center; }
.save-state { display: flex; align-items: center; gap: 5px; color: var(--muted); font-size: .75rem; white-space: nowrap; }
.save-state i { color: var(--green); }
#materials-count:empty { display: none; }
#materials-count { display: grid; place-items: center; min-width: 19px; min-height: 19px; padding-inline: 4px; border-radius: 6px; background: var(--leaf); font-size: .75rem; }
.work-layout { display: grid; grid-template-columns: minmax(0, 1.60fr) minmax(0, 1fr); }
.document { min-width: 0; padding: 21px; display: flex; flex-direction: column; }
.document-header, .document-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.document-header h2, .review-header h2 { margin: 0; font-size: 1.16rem; line-height: 1.35; }
.document-header p, .review-header p { margin: 3px 0 0; color: var(--muted); font-size: .875rem; }
.document-tools, .document-actions { display: flex; align-items: center; gap: 5px; }
.paper { min-height: 323px; flex: 1; margin-top: 14px; border: 1px solid var(--line); border-radius: 13px; background: var(--paper); overflow: hidden; }
.paper.editing:focus-within { border-color: #62876c; box-shadow: 0 0 0 2px #cfe4cd; }
.speech, #draft { display: block; width: 100%; min-height: 321px; padding: 19px clamp(14px, 2.1vw, 29px); margin: 0; font: 1.125rem/2.05 var(--font); color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.speech { max-height: 464px; overflow-y: auto; }
#read-script { font-size: 1.25rem; line-height: 1.95; }
#read-script.large { font-size: 1.75rem; }
#draft { border: 0; resize: vertical; outline: none; background: transparent; }
#draft::placeholder { color: var(--muted); }
.highlight { display: inline; padding: 1px .12em; font: inherit; color: inherit; line-height: inherit; border: 0; border-bottom: 2px solid var(--high-line); border-radius: 4px; background: var(--high-bg); }
.highlight.review { border-color: var(--review-line); background: var(--review-bg); }
.highlight.selected { border-color: var(--high); background: #f2d3cb; }
.highlight.review.selected { border-color: var(--review); background: #f6e4b3; }
.document-footer { margin-top: 12px; }
.document-meta { margin: 0; color: var(--muted); font-size: .8125rem; }
.jump-button { display: none; }
.review-pane { min-width: 0; background: var(--soft); border-left: 1px solid var(--line); border-radius: 0 0 19px 0; padding: 18px; }
.review-header { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
.review-heading { display: flex; align-items: center; gap: 8px; }
.review-icon { display: grid; place-items: center; width: 37px; height: 37px; border-radius: 10px; background: var(--leaf); color: var(--green); font-size: 1.13rem; flex: none; }
.apply-all { padding-inline: 7px; }
.review-body { margin-top: 13px; max-height: 490px; overflow-y: auto; padding: 2px 4px 2px 2px; margin-inline: -2px -4px; }
.issue-list, .record-list, .material-list { display: grid; gap: 8px; list-style: none; margin: 0; padding: 0; }
.issue { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.issue.selected { border-color: #a9bfab; box-shadow: 0 2px 8px #273e2d0e; }
.issue-trigger { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; min-height: 58px; text-align: left; border: 0; padding: 8px 11px; background: transparent; color: var(--ink); }
.issue-trigger:focus-visible { outline-offset: -4px; }
.issue-trigger:hover { background: #fafbf8; }
.issue-trigger strong { display: block; font-size: .9375rem; overflow-wrap: anywhere; }

function normalize(text) {
  return text.normalize('NFKC').toLowerCase().replace(/[\s：:]+/g, '');
}

function comparable(text, material) {
  const normalized = normalize(text);
  if (material === 'origin') return normalized.replace(/^(?:产自|来自|原产于)?(?:山东)?/, '').replace(/苹果$/, '');
  return normalized;
}

function matchesNote(note, phrase, material) {
  const claim = comparable(phrase, material);
  if (!claim) return false;
  return note.split(/[。；;\n]+/).some(line => {
    const source = normalize(line);
    if (/非|不适用|无证|未达|待核实|不含|不是|未确认|不可|不得|已失效/.test(source)) return false;
    const i = source.indexOf(claim);
    if (i < 0) return false;
    const qualifiers = source.slice(0, i) + source.slice(i + claim.length);
    if ((material === 'price' || material === 'fulfillment') &&
        /预计|部分地区|有条件|起步价|限[于领时量]|仅[限对供]|暂[不未停]/.test(qualifiers)) return false;
    if (!/\d/.test(claim)) return true;
    return !/[\d.~～\-–到至]/.test(source[i - 1] ?? '') &&
      !/[\d.~～\-–到至]/.test(source[i + claim.length] ?? '');
  });
}

function scan(clause, entries) {
  const matches = [];
  for (const rule of rules) {
    for (const hit of clause.matchAll(rule.pattern)) {
      const phrase = hit[0].trim();
      if (!phrase) continue;
      const start = hit.index + hit[0].indexOf(phrase);
      const end = start + phrase.length;
      if (matches.some(item => start < item.end && item.start < end)) continue;
      const material = entries[rule.material];
      const supported = rule.level === 'review' && Boolean(
        material?.confirmed && material.note && matchesNote(material.note, phrase, rule.material)
      );
      matches.push({ id: rule.id, phrase, start, end, material: rule.material, level: rule.level, title: rule.title, reason: rule.reason, supported });
    }
  }
  return matches.sort((a, b) => a.start - b.start);
}

function suggestionFor(matches) {
  const primary = matches.find(item => item.level === 'high') || matches[0];
  const replacements = {
    absolute: '我把实物拿近一点，大家自己看看',
    health: '大家可以按平时的饮食习惯来选',
    residue: '想了解这一批的检测情况，可以先问我，我们一起核对',
    cert: '想了解认证情况的朋友，可以先和我核对商品资料',
    origin: '想了解产地，可以看一下商品详情',
    spec: '需要多大一盒，可以先看看商品规格',
    price: '想了解价格，可以在商品页查看',
    delivery: '发货时间可以在商品页查看'
  };
  if (primary.id === 'absolute' && /最低价|最便宜/.test(primary.phrase)) {
    return '想了解今天的价格，可以点开商品页看一下';
  }
  return replacements[primary.id] || '';
}

function getClauses(draft, entries) {
  return [...draft.matchAll(/([^，。！？；,!?;、\n]+)([，。！？；,!?;、\n]*)/g)].map(hit => {
    const [, raw, separator] = hit;
    const clause = raw.trim();
    const start = hit.index + raw.indexOf(clause);
    const end = start + clause.length;
    return {
      id: hit.index, raw, separator, clause, start, end,
      before: draft.slice(hit.index, start),
      after: draft.slice(end, hit.index + raw.length),
      matches: clause ? scan(clause, entries) : []
    };
  });
}

const fallbackScript = '大家好，欢迎来到直播间。大家可以先看看商品详情，有想了解的地方，也可以在直播间留言。';

function rewriteClauses(draft, clauses, suggestions) {
  let revised = draft.slice(0, clauses[0]?.id ?? draft.length);
  let removedAtEnd = false;
  for (const piece of clauses) {
    if (!suggestions.has(piece.id)) {
      revised += piece.raw + piece.separator;
      removedAtEnd = false;
      continue;
    }
    const replacement = suggestions.get(piece.id);
    if (replacement) {
      revised += piece.before + replacement + piece.after + piece.separator;
      removedAtEnd = false;
      continue;
    }
    removedAtEnd = true;
    const ending = piece.separator.match(/[。！？!?][。！？!?]*\n*|\n+/)?.[0];
    if (!ending || !revised.trim()) continue;
    if (/[，、,；;][ \t]*$/.test(revised)) {
      revised = revised.replace(/[，、,；;][ \t]*$/, ending.startsWith('\n') ? '。' + ending : ending);
    } else if (ending.includes('\n')) {
      const trailingLines = ending.match(/\n+$/)?.[0] || '';
      if (!revised.endsWith('\n')) revised += trailingLines;
    }
  }
  if (removedAtEnd) revised = revised.trimEnd().replace(/[，、,；;]+$/, '。');
  return revised.trim() || fallbackScript;
}

function reviewDraft(draft, entries = {}, ai = []) {
  const clauses = getClauses(draft, entries);
  const model = new Map(ai.map(item => [item.id,item]));
  const uniqueClaims = new Map();
  const issues = [];
  for (const piece of clauses) {
    const pending = piece.matches.filter(item => !item.supported);
    for (const match of piece.matches) {
      const key = match.id + ':' + normalize(match.phrase);
      if (match.material && !uniqueClaims.has(key)) uniqueClaims.set(key, { ...match, key });
    }
    const hit = model.get(piece.id);
    if (hit && hit.phrase === piece.clause) {
      const linked = pending.find(m=>m.material);
      issues.push({id:piece.id,excerpt:piece.clause,high:hit.level==='high' || pending.some(m=>m.level==='high'),
        suggestion:hit.suggestion,ranges:[{phrase:piece.clause,start:piece.start,end:piece.end,
          level:hit.level,reason:hit.reason,material:linked?.material}]});
      continue;
    }
    if (!pending.length) continue;
    const ranges = pending.map(item => ({ ...item, start: piece.start + item.start, end: piece.start + item.end }));
    issues.push({
      id: piece.id, excerpt: piece.clause, ranges,
      high: pending.some(item => item.level === 'high'), suggestion: suggestionFor(pending)
    });
  }
  const rewrite = selected => rewriteClauses(draft, clauses, new Map(selected.map(issue => [issue.id, issue.suggestion])));
  return {
    issues, claims: [...uniqueClaims.values()], rewritten: issues.length ? rewrite(issues) : draft.trim(),
    apply: id => rewrite(issues.filter(issue => issue.id === id))
  };
}

let scrollFrame = null;
function pauseReader() {
  if (scrollFrame !== null) cancelAnimationFrame(scrollFrame);
  scrollFrame = null;

}

function toggleReader() {
  if (scrollFrame !== null) return pauseReader();
  const end = readScript.scrollHeight - readScript.clientHeight;
  if (end <= 1) return notify('当前稿件已完整显示');
  if (readScript.scrollTop >= end - 1) readScript.scrollTop = 0;
  let position = readScript.scrollTop;
  let previous = performance.now();
  byId('scroll-reader').textContent = '暂停滚动';
  function tick(time) {
    position += Math.max(0, Math.min(time - previous, 100)) * Number(byId('reader-speed').value) / 1000;
    previous = time;
    readScript.scrollTop = position;
    if (position >= readScript.scrollHeight - readScript.clientHeight) {
      pauseReader();
      byId('scroll-reader').textContent = '重新滚动';
    } else scrollFrame = requestAnimationFrame(tick);
  }
  scrollFrame = requestAnimationFrame(tick);
}
for (const event of ['wheel','pointerdown','keydown']) readScript.addEventListener(event, pauseReader);

function issueDetail(issue, index) {

  const suggestion = issue.suggestion ? `<q>${escape(issue.suggestion)}</q>` : '<span class="removed">删掉这段，接着念后面的话。</span>';
  return `<div class="issue-detail" id="issue-detail-${issue.id}">
    <p>${escape(explanation)}</p>
    <div class="suggestion"><span>建议怎么说</span>${suggestion}</div>
    <div class="issue-actions">
      <button class="button quiet" data-action="locate" data-id="${issue.id}">定位原句</button>
      ${evidence ? `<button class="button secondary" data-action="issue-material" data-id="${issue.id}">${current.materials[evidence] ? '核对材料' : '补材料'}</button>` : ''}
      <button class="button primary" data-action="apply" data-id="${issue.id}" aria-label="${issue.suggestion ? '应用改写' : '删除这段'}，第 ${index + 1} 条建议">${icon('check')}${issue.suggestion ? '应用改写' : '删除这段'}</button>
    </div>
  </div>`;
}

function ensureVisible(container, element) {
  if (!element) return;
  const parent = container.getBoundingClientRect();
  const child = element.getBoundingClientRect();
  if (child.top < parent.top || child.bottom > parent.bottom) {
    container.scrollTop += child.top - parent.top - 10;
  }
}

function invalidateReview() {
  if (reviewJob) reviewJob.abort();
  reviewJob = null;
  reviewMessage = '';
  current.ai = null;
}
async function requestReview() {
  if (reviewJob) return;
  const controller = new AbortController();
  reviewJob = controller;
  const body = JSON.stringify({draft:current.draft,product:current.name,batch:current.batch,materials:current.materials});
  const timer = setTimeout(()=>controller.abort(),210000);
  reviewMessage = 'DeepSeek 正在按助农直播文案规则审稿…';
  drawReview();
  async function send() {
    const response = await fetch('https://farmer-livestreaming-writer.dinnrm020920.workers.dev/review',{
      method:'POST',headers:{'Content-Type':'application/json'},body,signal:controller.signal});
    return {response,data:await response.json()};
  }
  try {
    let {response,data} = await send();
    if (reviewJob !== controller) return;
    if (response.status === 429 && Number.isInteger(data.retryAfter) && data.retryAfter > 0 && data.retryAfter <= 30) {
      reviewMessage = '写稿与审稿共用30秒间隔，约' + data.retryAfter + '秒后自动提交审稿。';
      drawReview();
      await new Promise(resolve => setTimeout(resolve,data.retryAfter*1000+200));
      if (reviewJob !== controller) return;
      reviewMessage = 'DeepSeek 正在审稿…';
      drawReview();
      ({response,data} = await send());
    }
    if (!response.ok || !Array.isArray(data.issues)) throw Error(data.error || '审稿服务暂时不可用。');
    if (reviewJob !== controller) return;
    current.ai = data.issues;
    reviewMessage = '';
    refreshAnalysis();
    recordDraft();
    persist();
  } catch (err) {
    if (reviewJob !== controller) return;
    const reason = err.name === 'AbortError' ? '审稿超时。' : err instanceof TypeError || err instanceof SyntaxError ? '无法连接审稿服务。' : err.message;
    reviewMessage = reason + ' 当前保留已有检查结果。';
  } finally {
    clearTimeout(timer);
    if (reviewJob === controller) {
      reviewJob = null;
      draw();
    }
  }
}

function checkDraft(next = 'review') {
  if (!current.draft.trim()) {
    view = 'edit';
    drawDocument();
    input.focus();
    notify('先粘贴或输入一段话术');
    return;
  }
  current.checked = true;
  refreshAnalysis();
  recordDraft();
  view = next;
  draw();
  persist();
  requestReview();
  if (next === 'read') focusReader();
  else if (selectedId !== null) focusIssue(selectedId);
  else byId('read-view').focus({ preventScroll: true });
}

function applySuggestion(id) {
  if (!analysis?.issues.length) return;
  const nextDraft = id === undefined ? analysis.rewritten : analysis.apply(id);
  if (nextDraft === current.draft) return;
  const count = id === undefined ? analysis.issues.length : 1;
  undoDrafts = [{draft:current.draft,ai:current.ai}, ...undoDrafts].slice(0, 20);
  const remaining = current.ai?.filter(hit => id !== undefined && hit.id !== id);
  const delta = nextDraft.length - current.draft.length;
  invalidateReview();
  if (remaining) current.ai = remaining.map(hit=>({...hit,id:hit.id > id ? hit.id+delta : hit.id}));
  current.draft = nextDraft;
  refreshAnalysis(id);
  if (id === undefined) view = 'read';
  recordDraft();
  draw();
  persist();
  if (id === undefined) focusReader();
  else if (selectedId === null) reviewBody.querySelector('[data-action=read-view]')?.focus({ preventScroll: true });
  else focusIssue(selectedId);
  notify(`已处理 ${count} 段，可以撤销`);
}

function undo() {
  if (!undoDrafts.length) return;
  invalidateReview();
  Object.assign(current,undoDrafts.shift());
  current.checked = true;
  refreshAnalysis();
  recordDraft();
  draw();
  persist();
  if (!undoDrafts.length) byId('draft-view').focus({ preventScroll: true });
  notify('已撤销上一次自动修改');
}

function enterEdit() {

function enterRead() {

function focusReader() {

async function pasteDraft() {
  input.focus();
  const id = current.id;
  const previous = input.value;
  const start = input.selectionStart;
  const end = input.selectionEnd;
  try {
    const text = await navigator.clipboard.readText();
    if (id !== current.id || previous !== input.value || view !== 'edit') return;
    if (!text) return notify('剪贴板里还没有可粘贴的文字');
    const available = input.maxLength - previous.length + end - start;
    const inserted = text.slice(0, available);
    input.setRangeText(inserted, start, end, 'end');
    input.dispatchEvent(new Event('input'));
    input.focus();
    if (inserted.length < text.length) notify('已粘贴，稿件最多 5000 字');
  } catch {
    notify(mobile.matches ? '可在输入框中长按，再选「粘贴」' : '请在输入框中用粘贴快捷键');

    tone: byId('writer-tone').value, draft: byId('writer-output').value };
  for (const button of modalBody.querySelectorAll('.writer-actions button')) button.disabled = !writingSession.draft.trim();
}

async function generateScript() {
  rememberWriting();
  const {product, notes, tone} = writingSession;
  const status = byId('writer-status');
  if (!product.trim() || !notes.trim()) {
    status.textContent = '请填写商品名称和讲解要点。';
    byId(!product.trim() ? 'writer-product' : 'writer-notes').focus();
    return;
  }
  const fields = [...modalBody.querySelectorAll('.writer-grid input,.writer-grid textarea,.writer-grid select,.writer-grid button')];
  const prior = fields.map(field => field.disabled);
  fields.forEach(field => field.disabled = true);
  status.textContent = tone === '全程讲解' ? '正在生成 30 分钟全程口播稿…' : 'DeepSeek 正在生成口播稿…';
  const controller = new AbortController();
  const cancel = () => controller.abort();
  const timeout = setTimeout(cancel, tone === '全程讲解' ? 170000 : 100000);
  dialog.addEventListener('close',cancel,{once:true});
  try {
    const response = await fetch('https://farmer-livestreaming-writer.dinnrm020920.workers.dev/generate', {
      method:'POST', headers:{'Content-Type':'application/json'}, signal:controller.signal,
      body:JSON.stringify({product,notes,tone})
    });
    const result = await response.json();
    if (!response.ok || typeof result.draft !== 'string' || !result.draft.trim()) {
      throw new Error(result.error || '服务暂时无法生成口播稿。');
    }
    if (!dialog.open || status !== byId('writer-status')) return;
    byId('writer-output').value = result.draft;
    writingSession.productionNotes = result.notes || '';
    const directions = byId('writer-directions');
    directions.querySelector('p').textContent = writingSession.productionNotes;
    directions.hidden = !writingSession.productionNotes;
    status.textContent = '口播稿已生成，可编辑、导出或送审。';
  } catch (error) {
    status.textContent = error.name === 'AbortError' ? '生成已中止，可重新尝试。' :
      (error instanceof TypeError || error instanceof SyntaxError ? '未能连接写稿服务，请稍后重试。' : error.message);
  } finally {
    clearTimeout(timeout);
    dialog.removeEventListener('close',cancel);
    if (status === byId('writer-status')) {
      fields.forEach((field,i) => field.disabled = prior[i]);
      rememberWriting();
    }
  }
}

function loadSampleOutput() {
  rememberWriting();
  const { product, notes, tone } = writingSession;
  const name = product.trim();
  const details = notes.split(/[，,、；;。！？\n]+/).map(s => s.trim()).filter(Boolean);
  if (!name || !details.length) {
    byId('writer-status').textContent = !name ? '先填写商品名称。' : '请至少填写一个讲解要点。';
    byId(!name ? 'writer-product' : 'writer-notes').focus();
    return;
  }
  const pack = [], flavor = [], other = [];
  for (const detail of details) {
    if (/装|每[盒箱袋份]|净重|规格|斤|千克|公斤/.test(detail)) pack.push(detail);
    else if (/口感|风味|味道|香|脆|甜|酸|软糯/.test(detail)) flavor.push(detail);
    else other.push(detail);
  }
  const lines = tone === '镜头展示'
    ? [`大家看镜头，我把${name}拿近一点，咱们一起看看。`]
    : tone === '日常推荐' ? [`平时给家里买东西，大家都会先看看合不合适。今天咱们聊聊${name}。`]
    : [`乡亲们好，今天给大家介绍一下${name}。`];
  if (other.length) lines.push(`这款${name}，${other.join('，')}。`);
  if (flavor.length) lines.push(`说到口感，${flavor.join('，')}。大家可以按自己平时喜欢的口味来挑。`);
  if (pack.length) lines.push(`再看规格，${pack.join('，')}。买之前算一算家里需要多少，合适了再下单。`);
  lines.push(tone === '镜头展示' ? '还想看哪个细节？告诉我，我把镜头转过去给大家看。' :
    tone === '日常推荐' ? '想再了解一下的朋友，可以点开商品详情慢慢看，有问题就在评论里问我。' :

  byId('writer-output').value = lines.join('\n\n');
  rememberWriting();
  byId('writer-status').textContent = '口播稿已生成，可直接修改。';
}

// Write the three required Open XML package parts into an uncompressed ZIP.
function wordDocument(value) {
  const encoder = new TextEncoder();
  const paragraphs = value.replace(/\r\n?/g,'\n').split('\n').map(line =>
    '<w:p><w:r><w:t xml:space="preserve">' + escape(line.replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f\ufffe\uffff]/g,'')) + '</w:t></w:r></w:p>').join('');
  const parts = {
    '[Content_Types].xml':'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>',
    '_rels/.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>',
    'word/document.xml':'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+paragraphs+'<w:sectPr/></w:body></w:document>'
  };
  const files = [], directory = [];
  let offset = 0, centralSize = 0;
  for (const [name, xml] of Object.entries(parts)) {
    const filename = encoder.encode(name), bytes = encoder.encode(xml);
    let crc = -1;
    for (const b of bytes) { crc ^= b; for(let bit=0;bit<8;bit++) crc = (crc >>> 1) ^ ((crc & 1) ? 0xedb88320 : 0); }
    const local = new Uint8Array(30), central = new Uint8Array(46);
    const l = new DataView(local.buffer), c = new DataView(central.buffer);
    l.setUint32(0,0x04034b50,true); l.setUint16(4,20,true); l.setUint16(12,33,true);
    l.setUint32(14,~crc,true); l.setUint32(18,bytes.length,true); l.setUint32(22,bytes.length,true); l.setUint16(26,filename.length,true);
    c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); central.set(local.subarray(4,28),6); c.setUint32(42,offset,true);
    files.push(local,filename,bytes); directory.push(central,filename);
    offset += local.length+filename.length+bytes.length; centralSize += central.length+filename.length;
  }
  const end = new Uint8Array(22), e = new DataView(end.buffer);
  e.setUint32(0,0x06054b50,true); e.setUint16(8,3,true); e.setUint16(10,3,true); e.setUint32(12,centralSize,true); e.setUint32(16,offset,true);
  return new Blob([...files,...directory,end],{type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

function exportScriptText(value, product) {
  if (!value.trim()) return;
  const a = document.createElement('a');
  const url = URL.createObjectURL(wordDocument(value));
  a.href = url; a.download = (product.trim() || '直播') + '-口播稿.docx';
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

  const entry = current.materials[type.id];
  const issue = analysis?.issues.find(item => item.id === issueId);
  const phrases = issue?.ranges.filter(range => range.material === type.id).map(range => range.phrase);
  const excerpt = phrases?.length ? `<p class="modal-copy">正在核对「${escape(phrases.join('、'))}」</p>` : '';

function alterMaterial(form, entry) {

  const before = analysis?.issues.length ?? 0;
  refreshAnalysis(issueId ?? selectedId);
  recordDraft();

  if (issueId === null) openMaterials();

  const reduced = before - (analysis?.issues.length ?? 0);
  notify(!entry ? '已移除材料' : reduced > 0 ? `材料已对上，减少 ${reduced} 段待处理` :
    issueId !== null ? '材料已保存，这段话仍需核对' : '材料已保存');
}

function requiredValue(form, values, name) {
  const value = values.get(name).trim();
  if (value) return value;
  const field = form.elements.namedItem(name);
  field.setCustomValidity('请填写内容');
  field.reportValidity();
  field.addEventListener('input', () => field.setCustomValidity(''), { once: true });
  return '';
}

dialog.addEventListener('submit', event => {
  event.preventDefault();
  const form = event.target;
  const values = new FormData(form);
  if (form.id === 'product-form') {
    const name = requiredValue(form, values, 'name');
    const batch = name && requiredValue(form, values, 'batch');
    if (!name || !batch) return;
    const pendingType = form.dataset.material;
    const issueId = form.dataset.issue ? Number(form.dataset.issue) : undefined;
    if (current.demo || current.name !== name || current.batch !== batch) {
      const changingPreviousBatch = !current.demo && current.name && current.batch;
      if (changingPreviousBatch) recordDraft();
      invalidateReview();
      current = { ...current, id: changingPreviousBatch ? localId() : current.id, name, batch, demo: false, materials: {} };
      refreshAnalysis();
      recordDraft();
      draw();
      persist();
    }
    if (pendingType) openMaterial(pendingType, issueId);
    else {
      dialog.close();
      notify('商品与批次已保存');
    }
    return;
  }
  if (form.id === 'material-form') {
    const note = requiredValue(form, values, 'note');
    if (note) alterMaterial(form, { note, confirmed: values.has('confirmed') });
  }
});

refreshAnalysis();
draw();
</script>
</body>
</html>
